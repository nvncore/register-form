<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang web mẫu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: #2563eb;
      color: #fff;
      padding: 1.5rem 2rem;
      text-align: center;
    }
    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    footer {
      text-align: center;
      padding: 1rem;
      color: #64748b;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Xin chào!</h1>
  </header>

  <main>
    <div class="card">
      <h2>Tiêu đề bài viết</h2>
      <p>Đây là mẫu HTML cơ bản có sẵn CSS giao diện đơn giản, responsive và dễ tùy chỉnh.</p>
      <button onclick="alert('Đã bấm nút!')">Bấm vào đây</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Trang web mẫu</p>
  </footer>

  <script>
    console.log("Trang web đã tải xong!");
  </script>
</body>
</html>
