<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang HTML mẫu (8 thẻ)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      line-height: 1.6;
      background-color: #f9fafb;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    button {
      padding: 8px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-right: 8px;
    }
    img {
      border-radius: 6px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Thẻ 1: <h1> -->
    <h1>1. Tiêu đề chính (&lt;h1&gt;)</h1>

    <!-- Thẻ 2: <p> -->
    <p>2. Đây là đoạn văn bản ví dụ sử dụng thẻ <code>&lt;p&gt;</code>.</p>

    <!-- Thẻ 3: <a> -->
    <p>3. Liên kết: <a href="https://google.com" target="_blank">&lt;a&gt; (Bấm vào đây)&lt;/a&gt;</a></p>

    <!-- Thẻ 4: <button> -->
    <p>4. Nút bấm: <button type="button">&lt;button&gt; (Click me)&lt;/button&gt;</button></p>

    <!-- Thẻ 5: <input> -->
    <p>5. Ô nhập: <input type="text" placeholder="Thẻ &lt;input&gt; ở đây" /></p>

    <!-- Thẻ 6: <ul> (kèm <li>) -->
    <div>
      <strong>6. Danh sách (&lt;ul&gt; &amp; &lt;li&gt;):</strong>
      <ul>
        <li>Mục 1</li>
        <li>Mục 2</li>
      </ul>
    </div>

    <!-- Thẻ 7: <img> -->
    <div>
      <strong>7. Hình ảnh 3333 (&lt;img&gt;):</strong><br>
      <img src="https://via.placeholder.com/150" alt="Ảnh demo" width="150" height="150" />
    </div>

    <!-- Thẻ 8: <blockquote> -->
    <blockquote>
      <strong>8. Trích dẫn (&lt;blockquote&gt;):</strong> "Học HTML thật đơn giản!"
    </blockquote>
  </div>
</body>
</html>
